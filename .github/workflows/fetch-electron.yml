name: Fetch Electron Runtime

on:
  push:
    paths:
      - '.github/workflows/fetch-electron.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Electron Linux x64 runtime
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 2 \
            -o electron-v43.2.0-linux-x64.zip \
            https://github.com/electron/electron/releases/download/v43.2.0/electron-v43.2.0-linux-x64.zip
          echo 'a2df5f8b93a2df5f8b93a2df5f8b93a2df5f8b93a2df5f8b93a2df5f8b93a2  electron-v43.2.0-linux-x64.zip' > EXPECTED_PLACEHOLDER.txt
          sha256sum electron-v43.2.0-linux-x64.zip > electron-v43.2.0-linux-x64.zip.sha256
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-v43.2.0-linux-x64
          path: |
            electron-v43.2.0-linux-x64.zip
            electron-v43.2.0-linux-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1
